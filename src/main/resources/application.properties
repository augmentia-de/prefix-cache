spring.application.name=prefix-cache

# OpenAI / LangChain4j Configuration
langchain4j.open-ai.chat-model.api-key=${OPENAI_API_KEY:your-api-key-here}
langchain4j.open-ai.chat-model.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
langchain4j.open-ai.chat-model.model-name=${LANGCHAIN4J_OPEN_AI_CHAT_MODEL_MODEL_NAME:https://api.openai.com/v1}
langchain4j.open-ai.chat-model.temperature=0.7

server.port=8080

# Request/Response exchange logging (req-<ts>.log / resp-<ts>.log files)
prefix.logging.dir=logs

logging.level.dev.prefix=DEBUG

# Fixed prefixes for known domains (optional)
# Format: prefix.cache.fixed-prefixes.domain_key=prefix_content
# Example:
# prefix.cache.fixed-prefixes.programming=## ROLE\nDeveloper assistant...\n--- END ---
# prefix.cache.fixed-prefixes.writing=## ROLE\nProfessional writer...\n--- END ---
# 
# These fixed prefixes bypass both LLM generation AND the generic cache lookup.
